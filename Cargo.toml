[package]
name = "lore"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Local-first knowledge engine for AI agents"
repository = "https://github.com/yurefr/lore"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
dirs = "6.0"
dunce = "1.0"
fs2 = "0.4"
notify = "6.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.15"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
